name: Build Windows EXE (manual)

# 说明：发版已由应用内「一键发布到 GitHub」完成（创建 Release + 上传 exe）。
# 本工作流仅用于手动在干净环境验证打包（不创建 Release，避免与应用的发版重复）。
on:
  workflow_dispatch:     # 仅在 Actions 页面手动触发

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: npm install

      - name: 为 Electron 重新编译原生模块（better-sqlite3）
        run: npx electron-builder install-app-deps

      - name: 打包便携版 exe（仅验证，不上传 Release）
        run: npm run dist        # 等价于 electron-builder --win portable → release/*.exe
